[project]
name = "research-core"
# Static on purpose. A dynamic version makes the conformance rule
# manifest-version-matches-package SKIP rather than fail, so the check would be
# lost silently.
version = "0.10.0"
description = "Shared core for the research smart tools: manifest, envelope, errors, run artifacts."
readme = "README.md"
# Preserve the public Python floor; the optional runtime is declared below.
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# SDKs, not credentials. Installing one makes a backend available; it is still
# refused at call time until a credential is configured. Neither is needed by any
# deterministic capability.
perplexity = ["perplexityai>=0.27.0"]
# Public Core/Foundation and installed modules; model turns do not download code.
# Keep the established extra name for consumers of research-core[agent].
agent = [
  "amplifier-core>=2.0.1,<3",
  "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main",
  "amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@main",
  "amplifier-module-loop-streaming @ git+https://github.com/microsoft/amplifier-module-loop-streaming@main",
  "amplifier-module-tool-web @ git+https://github.com/microsoft/amplifier-module-tool-web@main",
  "amplifier-module-provider-anthropic @ git+https://github.com/microsoft/amplifier-module-provider-anthropic@main",
  "amplifier-module-provider-openai @ git+https://github.com/microsoft/amplifier-module-provider-openai@main",
  "amplifier-module-provider-azure-openai @ git+https://github.com/microsoft/amplifier-module-provider-azure-openai@main",
  "amplifier-module-provider-gemini @ git+https://github.com/microsoft/amplifier-module-provider-gemini@main",
  "amplifier-module-provider-github-copilot @ git+https://github.com/microsoft/amplifier-module-provider-github-copilot@main",
  "amplifier-module-provider-openai-chatgpt @ git+https://github.com/microsoft/amplifier-module-provider-openai-chatgpt@main",
  "amplifier-module-provider-ollama @ git+https://github.com/microsoft/amplifier-module-provider-ollama@main",
  "amplifier-module-provider-chat-completions @ git+https://github.com/microsoft/amplifier-module-provider-chat-completions@main",
  "amplifier-module-provider-vllm @ git+https://github.com/microsoft/amplifier-module-provider-vllm@main",
]
agent-openai = ["openai>=1.50"]
agent-gemini = ["google-genai>=0.8"]

[tool.hatch.metadata]
# Required for the direct git reference in the agent extra.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_core"]
