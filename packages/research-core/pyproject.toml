[project]
name = "research-core"
# Static on purpose. A dynamic version makes the conformance rule
# manifest-version-matches-package SKIP rather than fail, so the check would be
# lost silently.
version = "0.8.0"
description = "Shared core for the research smart tools: manifest, envelope, errors, run artifacts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# SDKs, not credentials. Installing one makes a backend available; it is still
# refused at call time until a credential is configured. Neither is needed by any
# deterministic capability.
perplexity = ["perplexityai>=0.27.0"]
# The embedded agent engine, behind the reasoning turns and the agent backend.
# Heavy and git-only: it pulls amplifier-foundation, the Rust-backed
# amplifier-core, and an ASGI stack this tool never uses. Named as an extra so
# the weight is a visible decision rather than a silent one.
agent = [
  "amplifier-agent @ git+https://github.com/microsoft/amplifier-agent@main",
  # The engine declares NO provider client library and has no extras offering
  # one, so a credential alone cannot run a turn. Found by a live run that
  # preflighted clean and then died at mount time with "No module named
  # 'anthropic'". One default client ships so the agent path works out of the
  # box; the others are opt-in below.
  "anthropic>=0.40",
  # What tool-web and tool-search need, and the engine brings NONE of it. Found
  # one at a time, the hard way: aiohttp, then bs4, then ddgs -- each fix
  # revealed the next, because the engine logs a module that fails to load and
  # carries on without it. With any one missing there is no web search, and a
  # research agent with no search does not fail: it answers from memory and
  # records URLs it never opened as sources.
  "aiohttp>=3.9",
  "beautifulsoup4>=4.12",
  "ddgs>=9.0",
]
agent-openai = ["openai>=1.50"]
agent-gemini = ["google-genai>=0.8"]

[tool.hatch.metadata]
# Required for the direct git reference in the agent extra.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_core"]
