[pytest]
# amplifier-core ships a pytest plugin that auto-registers on import and then
# fails to load because it wants pytest-asyncio, which we do not use. Taking the
# agent engine as a dependency therefore broke the test runner for every test in
# this repository, including the ones that never touch a model.
#
# tmux-fleet hit this first and disables the plugin the same way. Disabling it is
# not a workaround for our own code: the plugin exists to serve Amplifier module
# authors, and nothing here is an Amplifier module.
addopts = -p no:amplifier_module
testpaths = packages/research-core/tests
